# ci.yml: build + host tests on every push and pull request; release on a version tag (X.Y.Z, no `v`).
# The logic lives in xewe-os-tools (.github/workflows/, doc/ci.md); this file only calls it.
# The release builds c3, c6 and s3 and publishes a GitHub Release with the images, the release card
# and the notes as assets. Binaries are never committed (doc/architecture.md D26).
name: ci
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-build.yml@3.1.0
    with:
      strict_lint: true
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-release.yml@3.1.0
